# Secret scanning — B14.
#
# `.gitleaks.toml` has been in this repository far longer than this workflow, and
# nothing ever ran it. The config shipped; no job executed it. That is a leak gate in
# name only, on a public repo, and it is the precise failure B14 was added to catch.
#
# TWO TRIGGERS, TWO DIFFERENT JOBS TO DO, and the second is the one usually dropped:
#
#   push / pull_request — gate the incoming change. Fast, shallow checkout is fine
#     because the diff is what is being judged.
#   schedule — scan FULL HISTORY. This needs fetch-depth: 0. A shallow checkout scans
#     one commit, which passes trivially and says nothing about the other fifty. A
#     credential in public history survives deletion of the commit that introduced it,
#     so the tip being clean is not the question.
#
# Both run the same `gitleaks detect`; only the checkout depth differs. fetch-depth: 0
# is set unconditionally rather than per-trigger — the gating run is cheap at this repo
# size, and a depth that depends on the trigger is one edit away from being wrong in
# the direction that fails silently.

name: Secret scan

on:
  push:
  pull_request:
  schedule:
    # Weekly, Monday 06:17 UTC. Off the hour deliberately — scheduled jobs at :00
    # queue behind everyone else's.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # full history — the tip being clean says nothing about history

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      # Pinned version, and installed here rather than assumed present. gitleaks happens
      # to be on the forge host this repo is developed on, which is exactly how a job
      # picks up an undeclared dependency and stops being reproducible on a clean runner.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # BEFORE the clean result is believed. "no leaks found" is what a working gate
      # reports on a clean tree and what a broken one reports on any tree at all.
      - name: Prove the gate fires on a planted secret
        run: python tests/check_gitleaks_gate.py

      - name: Scan full history
        run: gitleaks detect --source . --redact --config .gitleaks.toml

name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      # ruff's version comes from the `dev` extra, where it is pinned exactly
      # (ruff==0.16.0). Pinning it a second time here would be a second source of
      # truth for one fact, and the two would eventually disagree.
      - run: pip install -e ".[dev]"

      # src/ AND tests/. This linted `src/` only, so every rule was unenforced across
      # half the repository — the first run over tests/ found 31 unused imports and
      # three assertions that could not fail.
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

      # Coverage is MEASURED here, not merely configured. `pytest tests/ -v` ran with
      # no coverage at all, which left any fail_under in pyproject.toml inert: the
      # floor existed, nothing ever compared anything to it. --cov-fail-under is not
      # passed as a literal; it comes from [tool.coverage.report] so the number lives
      # in exactly one place.
      - run: pytest -v --cov --cov-report=term

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - run: docker build -t ollama-queue-proxy .

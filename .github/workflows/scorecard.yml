# OSSF Scorecard — F4.
#
# PUBLISHES RESULTS PUBLICLY. That is deliberate and was flagged as a decision rather
# than discovered as a surprise: `publish_results: true` sends the score to the OpenSSF
# public API, where anyone can read it. This repo is `visibility: public`, so its
# branch protection, token permissions, pinning and release practices are already
# observable — the score adds convenience, not exposure. Do not copy this file into a
# private repo without revisiting that line.
#
# The score will not start high, and that is fine. Scorecard grades against practices
# this repo has only just adopted (pinned actions, a secret-scanning gate, a lockfile)
# plus several it has not (branch protection, signed releases, a fuzzing harness). The
# number is a to-do list, not a verdict.

name: Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly. Most of what Scorecard measures — branch protection, admin settings,
    # dependency update tooling — changes outside a commit, so a push trigger would
    # miss precisely the drift this is here to catch.
    - cron: "23 4 * * 1"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF to the security tab
      id-token: write # OIDC, required by publish_results
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # Retained separately from the SARIF upload because the security tab keeps only
      # the findings, and the artifact keeps the whole scored run — which is what is
      # actually useful when a score moves and the question is which check changed.
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif

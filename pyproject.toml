[project]
name = "ollama-queue-proxy"
version = "0.5.1"
description = "Drop-in HTTP proxy for Ollama with priority queuing, per-client auth, and model-aware failover"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    # Pinned exactly, not >=. `ruff format --check` is a gate, and two patch releases
    # can disagree about whitespace — a floating formatter turns an unrelated PR red
    # for a reason nobody changed. The linter half has the same problem in reverse: a
    # new release adding a rule to one of the selected families fails CI on untouched
    # code. Taking a bump is a decision (Dependabot will propose it), not a default.
    #
    # 0.16.0 -> 0.16.6 taken 2026-09-13 (Dependabot #12). The decision was made by
    # running 0.16.6 against the tree BEFORE changing the pin: `ruff check src tests`
    # and `ruff format --check src tests` both came back clean, so the bump costs
    # nothing on code nobody edited. That measurement is the reason to take it — a
    # green CI run AFTER the pin moves would only prove the two agree, not that the
    # new version had nothing to say.
    "ruff==0.16.6",
    "anyio[trio]>=4.0",
]

[project.scripts]
ollama-queue-proxy = "ollama_queue_proxy.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# The eight fleet-mandated families (repo-standards.md, Python appendix). Previously
# ["E", "F", "W", "I"] — style and imports only, with no bug-class rules at all.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.coverage.run]
source = ["src/ollama_queue_proxy"]

[tool.coverage.report]
# Measured 75.82% on 2026-09-11 (219 passed, 2 skipped), raised from the 63% this
# change started at. Set just below the measured figure so ordinary variation does not
# flap the build, and never lowered to make a red build green — a floor that moves down
# on demand records nothing.
#
# CI measures slightly higher than a local run (75.82 local vs ~76 in CI): the valkey
# service container makes the two cache tests run that are skipped locally. The floor
# is therefore set from the LOWER of the two.
fail_under = 75

[project]
name = "ollama-queue-proxy"
version = "0.3.3"
description = "Drop-in HTTP proxy for Ollama with priority queuing, per-client auth, and model-aware failover"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    # Pinned exactly, not >=. `ruff format --check` is a gate, and two patch releases
    # can disagree about whitespace — a floating formatter turns an unrelated PR red
    # for a reason nobody changed. The linter half has the same problem in reverse: a
    # new release adding a rule to one of the selected families fails CI on untouched
    # code. Taking a bump is a decision (Dependabot will propose it), not a default.
    "ruff==0.16.0",
    "anyio[trio]>=4.0",
]

[project.scripts]
ollama-queue-proxy = "ollama_queue_proxy.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# The eight fleet-mandated families (repo-standards.md, Python appendix). Previously
# ["E", "F", "W", "I"] — style and imports only, with no bug-class rules at all.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.coverage.run]
source = ["src/ollama_queue_proxy"]

[tool.coverage.report]
# Measured 63% on 2026-09-11 (150 passed, 2 skipped) and set AT the measured value,
# so the floor starts out honest rather than aspirational. CI did not measure coverage
# at all before this change, which made any floor declared here inert.
#
# Raise this as coverage rises; never lower it to make a red build green. A floor that
# moves down on demand records nothing.
fail_under = 63

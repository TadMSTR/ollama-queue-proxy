# ollama-queue-proxy configuration
#
# Copy this file to config.yml and fill in your values.
# config.yml is in .gitignore — never commit it with real keys.
#
# WARNING: Default config has NO authentication.
# If exposing beyond localhost, set auth.enabled: true and configure API keys.
# The docker-compose.yml binds to 127.0.0.1 for this reason.
#
# All values can be overridden via environment variables using OQP_ prefix
# and __ for nesting. Examples:
#   OQP_PROXY__PORT=11435
#   OQP_OLLAMA__HOSTS__0__URL=http://ollama:11434
#   OQP_AUTH__ENABLED=true
#   OQP_ROUTING__STRATEGY=model_aware
#   OQP_EMBEDDING_CACHE__ENABLED=true
#   OQP_KEEP_ALIVE__DEFAULT=5m

proxy:
  host: "0.0.0.0"
  port: 11435
  max_concurrent: 2          # concurrent requests dispatched to Ollama at once.
                             # Set this to match Ollama's OLLAMA_NUM_PARALLEL (default 1 in Ollama;
                             # the proxy default of 2 assumes you've set OLLAMA_NUM_PARALLEL ≥ 2).
                             # Higher values increase throughput but also GPU memory pressure.
  allow_model_management: false  # block /api/pull, /api/push, /api/delete, /api/create, /api/copy
  drain_timeout: 30          # seconds to wait for in-flight requests on shutdown
  max_request_body_mb: 50    # reject bodies larger than this before buffering

ollama:
  hosts:
    # If Ollama is running natively (not in Docker):
    #   Linux:       http://172.17.0.1:11434
    #   Mac/Windows: http://host.docker.internal:11434
    # If Ollama is in the same Docker Compose stack, use its service name:
    #   http://ollama:11434
    - url: "http://ollama-primary:11434"
      name: "primary"
      weight: 1              # NEW v0.2.0: relative weight for weighted round-robin (default 1)
      model_sync_interval: 30  # NEW v0.2.0: seconds between /api/tags polls for routing table
    # - url: "http://ollama-secondary:11434"
    #   name: "secondary"
    #   weight: 1
    #   model_sync_interval: 30
  # DEPRECATED in 0.4.0 and no longer read. It drove a second host-health loop that
  # has been removed; ollama.hosts[].model_sync_interval is now the only poll interval,
  # and it polls every host rather than only unhealthy ones. Setting this logs a
  # warning at startup. Left here, commented, so an operator upgrading finds the note
  # rather than silently losing the behaviour they configured.
  # health_check_interval: 30
  request_timeout: 300       # seconds before upstream timeout

queue:
  # Total bytes allowed to sit in the queue across all tiers. Depth limits bound the
  # NUMBER of waiting requests; a queued request holds its whole body until dispatch,
  # so this is what bounds memory. Over the cap the proxy answers 503 + Retry-After.
  #
  # Exemption: when the queues are empty a request is admitted even if its body alone
  # exceeds the cap, so an oversized body cannot deadlock against a permanently
  # unsatisfiable ceiling.
  max_queued_mb: 512

  high:
    max_depth: 50
    max_wait: 120            # seconds before stale request is dropped
    high_watermark_pct: 80  # fire queue.high_watermark webhook at this % of max_depth
  normal:
    max_depth: 100
    max_wait: 300
    high_watermark_pct: 80
  low:
    max_depth: 200
    max_wait: 600
    high_watermark_pct: 80
  overflow_status_code: 503  # 503 or 429

webhooks:
  enabled: false
  url: ""                    # POST target for queue events; fire-and-forget (5s timeout)
  # Note: webhook payloads include client_id. If using a third-party target, be aware
  # that client identifiers will be shared externally.
  events:
    - queue.full
    - queue.high_watermark
    - queue.drained
    - host.unhealthy
    - host.recovered

auth:
  enabled: false             # set true to require API keys on all requests
  # WARNING: auth.enabled: true with no keys configured is a fatal startup error.
  keys: []
  # Example keys:
  # - key: "${ADMIN_API_KEY}"       # or hardcode, but use env vars for real deployments
  #   client_id: "admin"
  #   description: "Admin key — full access"
  #   max_priority: high
  #   scope: management             # required to call /queue/pause, /drain, /flush
  #   max_concurrent: 0            # 0 = unlimited (subject to proxy.max_concurrent)
  # - key: "${OPENWEBUI_API_KEY}"
  #   client_id: "openwebui"
  #   description: "Open WebUI — interactive"
  #   max_priority: high
  #   scope: inference              # the default; may be omitted
  #   max_concurrent: 0
  # - key: "${MEMSEARCH_API_KEY}"
  #   client_id: "memsearch-watch"
  #   description: "Background embedding re-index jobs"
  #   max_priority: low
  #   max_concurrent: 2            # cap batch client at 2 concurrent
  # - key: "${HOMEPAGE_API_KEY}"
  #   client_id: "homepage"
  #   description: "Status widget / dashboard — cannot spend GPU time"
  #   scope: read
  #
  # scope: one ordered axis, three cumulative levels. Default `inference`.
  #
  #   read        /queue/status, /queue/summary, /metrics, /dashboard. NOTHING upstream —
  #               refused at /api/generate AND at cheap metadata reads like /api/tags, so
  #               the rule is "read sees the proxy, not Ollama" with no path exceptions.
  #   inference   the above, plus proxying requests to Ollama. What every key did before
  #               0.5.0, which is why it is the default: an existing config keeps working.
  #   management  the above, plus /queue/pause, /resume, /drain, /flush.
  #
  # Issue `scope: read` to anything that only needs to LOOK at the proxy — a status
  # widget, a Prometheus scraper, the dashboard. Before 0.5.0 no such key existed: every
  # credential, `management: false` included, could buy GPU time.
  #
  # SCOPE IS UNENFORCED WHEN auth.enabled IS FALSE. No key is presented, so there is no
  # scope to check and every endpoint is open to anyone who can reach the port. This is
  # the same caveat that always applied to `management`; it now covers `scope` too.
  #
  # DEPRECATED: `management: true` still works and maps to scope: management, logging a
  # warning at startup that names the client_id. Setting BOTH management: true and a
  # scope that is not management is a startup error, not a precedence rule — a config
  # that contradicts itself about a privilege should not boot and pick a winner. An
  # explicit `management: false` conflicts with nothing: it is the field's default, so
  # it asserts nothing, and leaving those lines in place while adding scope: elsewhere
  # is a supported migration.
  # Each entry needs EXACTLY ONE of key / key_env / key_file:
  #
  #   key:      "literal"                    literal in this file
  #   key_env:  OQP_KEY_SEARXNG              read from the environment
  #   key_file: /run/secrets/oqp-searxng     read from a file (trailing \n stripped)
  #
  # key_env / key_file exist because OQP_AUTH__KEYS__0__KEY does NOT work: the env
  # override mechanism skips any path with a numeric component, and the list index
  # trips it. A literal here was the only option until 0.4.0 by accident, not design.
  #
  # Startup fails with a message naming the client_id (never the value) if a source is
  # missing, unreadable, doubled, absent, or resolves to empty.

  # This throttles FAILED AUTHENTICATION ATTEMPTS PER IP. It is not a request rate
  # limit: an authenticated client can send as many requests as it likes, bounded by
  # the queue and its max_concurrent, not by this. Named `rate_limit` for historical
  # reasons; read it as "auth brute-force throttle".
  rate_limit:
    max_failures: 10         # consecutive auth failures per IP before 429
    window_seconds: 60       # rolling window for failure counting

logging:
  level: "info"
  format: "json"             # json or text

# ---------------------------------------------------------------------------
# NEW v0.2.0 — Client injection
# ---------------------------------------------------------------------------
# Port-based auth bypass for clients that can't send Bearer headers.
# Each injection listener binds to a separate port and injects a fixed client
# identity. The client doesn't need to send any Authorization header.
#
# SECURITY:
# - Injection ports default to 127.0.0.1 (loopback only).
# - Binding to non-loopback addresses requires allow_public_injection: true.
# - If allow_public_injection: true AND auth.enabled: false, the proxy emits a
#   startup security warning — any host on the network can consume GPU time.
# - Authorization headers received on injection ports are stripped before
#   forwarding to upstream — tokens are never relayed to Ollama.
#
# client_injection:
#   listeners:
#     - listen_port: 11436
#       inject_as: memsearch-watch     # must match an auth.keys[].client_id
#       bind: 127.0.0.1               # default: loopback only
#     - listen_port: 11437
#       inject_as: localllm
#   allow_public_injection: false     # must be true to bind to non-loopback

# ---------------------------------------------------------------------------
# NEW v0.2.0 — Model-aware routing
# ---------------------------------------------------------------------------
# Route requests to an Ollama host that already has the target model INSTALLED.
#
# Installed, not loaded. The router reads /api/tags (models on disk), not /api/ps
# (models resident in VRAM). This avoids picking a host that would have to pull the
# model; it does NOT avoid cold-start latency. Where every host has the same models
# pulled, model_aware has nothing to discriminate on and behaves as weighted
# round-robin.
#
# Polling uses ollama.hosts[].model_sync_interval (per host, default 30s), and polls
# every host on every interval regardless of current reachability.
# Weighted round-robin is deterministic: weight=2 means 2 requests per 1 for weight=1.
#
# Startup: probes all hosts via /api/tags once before accepting requests.
# Fails fast if no host responds.
#
# OQP_ROUTING__STRATEGY=model_aware
#
# routing:
#   strategy: model_aware            # model_aware | round_robin (default: round_robin)
#   fallback: any_healthy            # when no host has the model installed: pick any reachable host
#   model_poll_timeout: 3            # seconds for each /api/tags poll

# ---------------------------------------------------------------------------
# NEW v0.2.0 — Embedding cache
# ---------------------------------------------------------------------------
# Hash-keyed Valkey (or Dragonfly drop-in) cache for /api/embed and /api/embeddings.
# Cache hits bypass the queue and upstream entirely.
#
# Backend: Valkey is recommended. Dragonfly is a supported drop-in (same RESP protocol).
# For a Valkey service in the same Docker Compose stack:
#   backend: "redis://valkey:6379/0"
#
# Startup: if enabled: true, the proxy pings the backend. Startup aborts if unreachable.
# Runtime: RESP errors degrade gracefully — logged once/minute, bypass cache, no user failure.
#
# OQP_EMBEDDING_CACHE__ENABLED=true
# OQP_EMBEDDING_CACHE__BACKEND=redis://valkey:6379/0
#
# embedding_cache:
#   enabled: false
#   backend: "redis://valkey:6379/0"
#   ttl: 86400                        # seconds (24 hours default)
#   max_entry_bytes: 32768            # skip caching responses larger than this (32 KB)
#   key_prefix: "oqp:embed:"
#   connect_timeout: 2               # seconds; startup aborts if unreachable

# ---------------------------------------------------------------------------
# NEW v0.2.0 — keep_alive defaulting
# ---------------------------------------------------------------------------
# Inject a keep_alive value into request bodies so Ollama doesn't unload models
# between bursty requests. Applies to: /api/generate, /api/chat, /api/embed, /api/embeddings.
#
# override: false — only inject if the client doesn't send keep_alive
# override: true  — always replace the client's value with the proxy default
#
# OQP_KEEP_ALIVE__DEFAULT=5m
#
# keep_alive:
#   default: "5m"
#   override: false

# ---------------------------------------------------------------------------
# Embedded read-only dashboard
# ---------------------------------------------------------------------------
dashboard:
  # Default false: it fails closed, and a new surface should be opted into rather than
  # appearing on every deployment that upgrades. When false, /dashboard returns 404 —
  # not 401 — because a feature you have turned off should not advertise itself to a
  # caller who cannot use it.
  enabled: false

  # Browser poll interval for /queue/summary and /queue/status. Polling stops while the
  # tab is hidden.
  refresh_seconds: 5

  # THERE IS NO `path` KEY, deliberately. The dashboard is always served at /dashboard.
  #
  # It must not take "/": that path is in the metadata fast-path list and is proxied to
  # Ollama, where it answers "Ollama is running", so taking it would break every
  # Ollama-compatible client that probes the root. A fixed path settles that by
  # construction rather than by a validator an operator can defeat.
  #
  # The route is also registered before config is read, so that a DISABLED dashboard can
  # answer its own 404 rather than falling through to the proxy catch-all — which would
  # either refuse the caller as inference or forward "/dashboard" to Ollama. Neither
  # discloses less than a 404 does.
  #
  # Requires `read` scope. With auth.enabled: true a browser cannot send an
  # Authorization header on a navigation, so put it behind a reverse proxy that injects
  # the header or a forward-auth layer that sets a cookie; the page's own polls are
  # same-origin and inherit whatever authenticated the page. No key is embedded in the
  # HTML.
